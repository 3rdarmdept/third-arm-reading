<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Third Arm Dept. — 1차 진단 기록</title>
<!-- 제3 팔 공방 · 1차 진단 기록 읽기 페이지.
     · GitHub Pages에 index.html 로 올려 두면, 주소 끝의 #<계정>/<gist 번호> 로 그 사람의 글을 불러와 보여 준다.
       (# 뒤의 값은 GitHub Pages 서버로 가지 않는다)
     · 접수 프로그램은 같은 파일에 글을 박아 넣어 보관 폴더의 reading.html 을 만든다 — 그때는 아무것도 불러오지 않는다.
     · 글의 표시는 '# 제목', '> 안내', '## 소제목', '**굵게**', '---' 뿐이다. 나머지는 전부 글자 그대로 넣는다. -->
<style>
  :root{--ink:#141414;--paper:#f7f5ef;--card:#fbfaf6;--mute:#6b6b66;--line:#141414;
    --font:"Pretendard Variable","Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--paper);color:var(--ink);font-family:var(--font);font-weight:300;font-size:17px;line-height:1.85;word-break:keep-all;overflow-wrap:anywhere;padding:28px 18px 64px}
  main{max-width:640px;margin:0 auto}
  .dept{font-size:11px;letter-spacing:.16em;font-weight:400}
  h1{font-size:22px;font-weight:500;line-height:1.4;margin:14px 0 6px}
  .meta{font-size:13px;letter-spacing:.04em;color:var(--mute);margin-bottom:18px}
  .note{font-size:14px;line-height:1.7;color:var(--mute);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0;margin:0 0 8px}
  h2{font-size:12px;font-weight:400;letter-spacing:.14em;color:var(--mute);margin:40px 0 8px}
  p{margin:10px 0}
  strong{font-weight:600}
  .gk{color:var(--mute)}
  hr{border:0;border-top:1px solid var(--line);margin:44px 0 14px}
  .end{font-size:13px;line-height:1.7;color:var(--mute)}
  .state{color:var(--mute);font-size:15px;margin-top:40px}
  footer{margin-top:48px;font-size:11px;letter-spacing:.16em;color:var(--mute)}
  @media print{body{background:#fff;padding:0}}
</style>
</head>
<body>
<main id="out"><p class="dept">THIRD ARM DEPT. 제3 팔 공방</p><p class="state" id="state">불러오는 중…</p></main>
<script type="text/markdown" id="md"></script>
<script>
(function () {
  "use strict";
  var FILE = "third-arm-reading.md";
  var out = document.getElementById("out");
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  // 한 줄 안의 **굵게** 와 ° 만 꾸민다. 글자는 전부 textContent 로 넣는다.
  function inline(p, line) {
    line.split("**").forEach(function (part, i) {
      if (!part) return;
      var host = i % 2 ? p.appendChild(el("strong")) : p;
      part.split("°").forEach(function (t, j) {
        if (j) host.appendChild(el("span", "gk", "°"));
        if (t) host.appendChild(document.createTextNode(t));
      });
    });
    return p;
  }
  function render(md) {
    out.textContent = "";
    out.appendChild(el("p", "dept", "THIRD ARM DEPT. 제3 팔 공방"));
    var afterRule = false, metaDone = false;
    md.replace(/\r/g, "").split("\n").forEach(function (raw) {
      var line = raw.trim();
      if (!line) return;
      if (line.indexOf("# ") === 0) { out.appendChild(el("h1", null, line.slice(2).replace(/^THIRD ARM DEPT\.\s*—\s*/, ""))); return; }
      if (line.indexOf("> ") === 0) { out.appendChild(el("p", "note", line.slice(2))); metaDone = true; return; }
      if (line.indexOf("## ") === 0) { out.appendChild(el("h2", null, line.slice(3))); metaDone = true; return; }
      if (line === "---") { out.appendChild(el("hr")); afterRule = true; return; }
      if (!metaDone && out.querySelector("h1") && !out.querySelector(".meta")) { out.appendChild(el("p", "meta", line)); metaDone = true; return; }
      out.appendChild(inline(el("p", afterRule ? "end" : null), line));
    });
    out.appendChild(el("footer", null, "THIRD ARM DEPT."));
    var h1 = out.querySelector("h1");
    if (h1) document.title = "Third Arm Dept. — " + h1.textContent;
  }
  function fail(msg) {
    var s = document.getElementById("state");
    if (s) s.textContent = msg || "글을 불러오지 못했습니다. 인터넷 연결을 확인하고 잠시 뒤 다시 열어 주세요.";
  }
  var embedded = document.getElementById("md").textContent.trim();
  if (embedded) { render(embedded); return; }
  // #계정/gist번호 — 먼저 gist의 원문 주소, 안 되면 GitHub API에서 받아 온다
  var m = decodeURIComponent(location.hash.slice(1)).match(/^([A-Za-z0-9-]{1,39})\/([0-9a-f]{20,40})$/);
  if (!m) { fail("공방에서 받은 QR코드로 열어 주세요."); return; }   // 주소만으로 열었을 때 (글 번호 없음)
  var raw = "https://gist.githubusercontent.com/" + m[1] + "/" + m[2] + "/raw/" + FILE;
  fetch(raw, { cache: "no-cache" }).then(function (r) { if (!r.ok) throw 0; return r.text(); })
    .catch(function () {
      return fetch("https://api.github.com/gists/" + m[2]).then(function (r) { if (!r.ok) throw 0; return r.json(); })
        .then(function (g) { var f = g.files && g.files[FILE]; if (!f || !f.content) throw 0; return f.content; });
    })
    .then(render, function () { fail(); });
})();
</script>
</body>
</html>
